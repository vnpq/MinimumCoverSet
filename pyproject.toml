[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "min-cover-set"
version = "0.1.0"
description = "Algorithms for the minimum set cover problem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
notebook = [
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.scripts]
min-cover-set = "min_cover_set.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["data_generator"]
